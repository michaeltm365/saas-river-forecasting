# =============================================================================
# RGCN "consistency" variant A — phases blocked-holdout split
# =============================================================================
# Same protocol changes as config_consist80.yml (30-day window, forecast-tail
# obs masking, +1 day date_start for grid alignment) on the phases split:
# val = three 12-day blocks (Jul 18-29 drying, Sep 10-21 peak dry, Oct 10-21
# rewetting 2020) with 7-day guard buffers. This is the headline honest split.
# Run: RGCN_CONFIG=rgcn/config_consistph.yml uv run python -m rgcn.pipeline.<stage>

paths:
  obs_csv: "data/sciencebase/obs.csv"
  met_drivers_csv: "data/sciencebase/met_drivers.csv"
  static_vars_csv: "data/sciencebase/static_vars.csv"
  released_graph: "data/huggingface/hja_graph.gpickle"

  drivers_parquet: "data/retrain/met_drivers.parquet"
  graph_out: "data/retrain/hja_graph_drivers.gpickle"

  split_map: "data/retrain/window_split_map_consistph.csv"
  split_meta: "data/retrain/split_meta_consistph.json"
  scaler_json: "data/retrain/feature_scaler_consistph.json"
  feature_arrays: "data/retrain/feature_arrays_consistph.npz"
  checkpoint: "data/retrain/ablations/abl_l10c10.pt"
  predictions_dir: "data/retrain/ablations/predictions_l10c10"
  eval_report: "results/ablations/rgcn_eval_l10c10.md"
  hjflp_report: "results/ablations/rgcn_eval_hjflp_l10c10.md"

windows:
  date_start: "1980-01-02"
  date_end: "2020-12-31"
  seq_length: 30
  forecast_horizon: 3
  stride: 3

split:
  method: holdout_blocks
  holdout_blocks:
    - ["2020-07-18", "2020-07-29"]
    - ["2020-09-10", "2020-09-21"]
    - ["2020-10-10", "2020-10-21"]
  guard_days: 7

masking:
  forecast_mask: obs     # none | obs | obs+drivers

model:
  version: "v2"
  hidden_dim: 64
  dropout: 0.1
  recur_dropout: 0.0
  return_states: false

training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stopping_patience: 20
  lambda_discharge: 1.0
  lambda_wetdry: 1.0
  false_positive_weight: 2.0
  seed: 42
