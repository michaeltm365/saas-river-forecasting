# =============================================================================
# RGCN "consistency" variant A — q80 temporal split, LSTM-comparable protocol
# =============================================================================
# Two changes vs config.yml, both for consistency with the paper's LSTM setup:
#   1. seq_length 28 -> 30 (LSTM uses 30-day input windows).
#   2. masking.forecast_mask = obs: observation-derived inputs in the forecast
#      tail (lag-1 features, MaxDepth) are frozen at their last legitimately-
#      known values, so day-2/3 forecasts no longer see observations from
#      inside the forecast period (see rgcn/pipeline/masking.py). GridMET
#      drivers stay live in the tail ("given a weather forecast" framing).
# date_start shifts +1 day so the day-3 date grid (start + 32, stride 3) stays
# on the same 1980-01-31 + 3k residue class as the 28-day configs.
# Run: RGCN_CONFIG=rgcn/config_consist80.yml uv run python -m rgcn.pipeline.<stage>

paths:
  obs_csv: "data/sciencebase/obs.csv"
  met_drivers_csv: "data/sciencebase/met_drivers.csv"
  static_vars_csv: "data/sciencebase/static_vars.csv"
  released_graph: "data/huggingface/hja_graph.gpickle"

  drivers_parquet: "data/retrain/met_drivers.parquet"
  graph_out: "data/retrain/hja_graph_drivers.gpickle"

  split_map: "data/retrain/window_split_map_consist80.csv"
  split_meta: "data/retrain/split_meta_consist80.json"
  scaler_json: "data/retrain/feature_scaler_consist80.json"
  feature_arrays: "data/retrain/feature_arrays_consist80.npz"
  checkpoint: "data/retrain/best_model_consist80.pt"
  predictions_dir: "data/retrain/predictions_consist80"
  eval_report: "results/rgcn_eval_consist80.md"

windows:
  date_start: "1980-01-02"
  date_end: "2020-12-31"
  seq_length: 30
  forecast_horizon: 3
  stride: 3

split:
  method: quantile_cutoff
  wetdry_quantile: 0.80

masking:
  forecast_mask: obs     # none | obs | obs+drivers

model:
  version: "v2"
  hidden_dim: 64
  dropout: 0.1
  recur_dropout: 0.0
  return_states: false

training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stopping_patience: 20
  lambda_discharge: 1.0
  lambda_wetdry: 0.5
  false_positive_weight: 2.0
  seed: 42
