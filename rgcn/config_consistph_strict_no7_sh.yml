# =============================================================================
# RGCN A-strict no-7d + with-sensor site holdout
# =============================================================================
# As consistph_strict_no7 plus the same 5-reach with-sensor holdout.
# SHARES split map / feature arrays / scaler with config_consistph (run its
# make_splits + prepare_data first). Auto-generated variant of config_consistph.

paths:
  obs_csv: "data/sciencebase/obs.csv"
  met_drivers_csv: "data/sciencebase/met_drivers.csv"
  static_vars_csv: "data/sciencebase/static_vars.csv"
  released_graph: "data/huggingface/hja_graph.gpickle"

  drivers_parquet: "data/retrain/met_drivers.parquet"
  graph_out: "data/retrain/hja_graph_drivers.gpickle"

  split_map: "data/retrain/window_split_map_consistph.csv"
  split_meta: "data/retrain/split_meta_consistph.json"
  scaler_json: "data/retrain/feature_scaler_consistph.json"
  feature_arrays: "data/retrain/feature_arrays_consistph.npz"

  checkpoint: "data/retrain/best_model_consistph_strict_no7_sh.pt"
  predictions_dir: "data/retrain/predictions_consistph_strict_no7_sh"
  eval_report: "results/rgcn_eval_consistph_strict_no7_sh.md"
  hjflp_report: "results/rgcn_eval_hjflp_consistph_strict_no7_sh.md"

windows:
  date_start: "1980-01-02"
  date_end: "2020-12-31"
  seq_length: 30
  forecast_horizon: 3
  stride: 3

split:
  method: holdout_blocks
  holdout_blocks:
    - ["2020-07-18", "2020-07-29"]
    - ["2020-09-10", "2020-09-21"]
    - ["2020-10-10", "2020-10-21"]
  guard_days: 7

masking:
  forecast_mask: obs+drivers

features:
  exclude_time:
    - "Discharge_CMS_lag_7"
    - "HoboWetDry0.05_lag_7"

# With-sensor site holdout: these reaches keep their obs-lag INPUTS but their
# labels are removed from the training/val loss; scored post hoc as spatially
# unseen sites. 2 intermittent (097170 dry-frac 0.40, 100137 0.68) + 3
# perennial reaches, 622 labels (23% of pool) held out.
site_holdout:
  nhd_ids:
    - 55000900097170
    - 55000900100137
    - 55000900099610
    - 55000900235848
    - 55000900271029

model:
  version: "v2"
  hidden_dim: 64
  dropout: 0.1
  recur_dropout: 0.0
  return_states: false

training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stopping_patience: 20
  lambda_discharge: 1.0
  lambda_wetdry: 0.5
  false_positive_weight: 2.0
  seed: 42
