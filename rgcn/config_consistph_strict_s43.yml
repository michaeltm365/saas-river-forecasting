# =============================================================================
# RGCN "consistency" variant A-strict — phases split, NO post-t information
# =============================================================================
# Identical to config_consistph.yml except masking.forecast_mask=obs+drivers:
# the GridMET driver columns in the forecast tail are also frozen at day t
# (persistence "weather forecast"), so the model's information set exactly
# matches the LSTM's (nothing dated after t). The gap between this and
# config_consistph quantifies the value of future meteorology.
#
# SHARES the split map / feature arrays / scaler with config_consistph — run
# make_splits + prepare_data under config_consistph first; only train /
# export_predictions / eval_report run under this config.

paths:
  obs_csv: "data/sciencebase/obs.csv"
  met_drivers_csv: "data/sciencebase/met_drivers.csv"
  static_vars_csv: "data/sciencebase/static_vars.csv"
  released_graph: "data/huggingface/hja_graph.gpickle"

  drivers_parquet: "data/retrain/met_drivers.parquet"
  graph_out: "data/retrain/hja_graph_drivers.gpickle"

  # shared with config_consistph (read-only here)
  split_map: "data/retrain/window_split_map_consistph.csv"
  split_meta: "data/retrain/split_meta_consistph.json"
  scaler_json: "data/retrain/feature_scaler_consistph.json"
  feature_arrays: "data/retrain/feature_arrays_consistph.npz"

  # strict-variant outputs
  checkpoint: "data/retrain/best_model_consistph_strict_s43.pt"
  predictions_dir: "data/retrain/predictions_consistph_strict_s43"
  eval_report: "results/rgcn_eval_consistph_strict_s43.md"
  hjflp_report: "results/rgcn_eval_hjflp_consistph_strict_s43.md"

windows:
  date_start: "1980-01-02"
  date_end: "2020-12-31"
  seq_length: 30
  forecast_horizon: 3
  stride: 3

split:
  method: holdout_blocks
  holdout_blocks:
    - ["2020-07-18", "2020-07-29"]
    - ["2020-09-10", "2020-09-21"]
    - ["2020-10-10", "2020-10-21"]
  guard_days: 7

masking:
  forecast_mask: obs+drivers   # none | obs | obs+drivers

model:
  version: "v2"
  hidden_dim: 64
  dropout: 0.1
  recur_dropout: 0.0
  return_states: false

training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stopping_patience: 20
  lambda_discharge: 1.0
  lambda_wetdry: 0.5
  false_positive_weight: 2.0
  seed: 43
