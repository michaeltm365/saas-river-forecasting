paths:
  obs_csv: data/sciencebase/obs.csv
  met_drivers_csv: data/sciencebase/met_drivers.csv
  static_vars_csv: data/sciencebase/static_vars.csv
  released_graph: data/huggingface/hja_graph.gpickle
  drivers_parquet: data/retrain/met_drivers.parquet
  graph_out: data/retrain/hja_graph_drivers.gpickle
  split_map: data/retrain/paper/arrays/window_split_map_flagq65.csv
  split_meta: data/retrain/paper/arrays/split_meta_flagq65.json
  scaler_json: data/retrain/paper/arrays/feature_scaler_flagq65.json
  feature_arrays: data/retrain/paper/arrays/feature_arrays_flagq65.npz
  checkpoint: data/retrain/paper/sensitivity/l05c10.pt
  predictions_dir: data/retrain/paper/sensitivity/predictions_l05c10
  eval_report: results/paper/sensitivity/l05c10.md
  hjflp_report: results/paper/sensitivity/l05c10_hjflp.md
windows:
  date_start: '1980-01-02'
  date_end: '2020-12-31'
  seq_length: 30
  forecast_horizon: 3
  stride: 3
split:
  method: quantile_cutoff
  wetdry_quantile: 0.65
masking:
  forecast_mask: obs+drivers
features:
  exclude_time:
  - Discharge_CMS_lag_7
  - HoboWetDry0.05_lag_7
  status_availability: true
model:
  version: v2
  hidden_dim: 64
  dropout: 0.1
  recur_dropout: 0.0
  return_states: false
training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stopping_patience: 20
  lambda_discharge: 0.5
  lambda_wetdry: 1.0
  false_positive_weight: 2.0
  seed: 42
