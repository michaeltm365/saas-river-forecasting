# =============================================================================
# Flagship RGCN (A-strict, no lag-7) — split ph, seed 42
# =============================================================================
# Auto-generated (flagship family, Sep 2026). 30d windows, obs+drivers tail
# masking, lag-7 features excluded (35 inputs incl. 17 statics).
# Split files are shared per split family — run make_splits + prepare_data
# once under the seed-42 base config of this split before training variants.

paths:
  obs_csv: "data/sciencebase/obs.csv"
  met_drivers_csv: "data/sciencebase/met_drivers.csv"
  static_vars_csv: "data/sciencebase/static_vars.csv"
  released_graph: "data/huggingface/hja_graph.gpickle"

  drivers_parquet: "data/retrain/met_drivers.parquet"
  graph_out: "data/retrain/hja_graph_drivers.gpickle"

  split_map: "data/retrain/flagship/window_split_map_flagph.csv"
  split_meta: "data/retrain/flagship/split_meta_flagph.json"
  scaler_json: "data/retrain/flagship/feature_scaler_flagph.json"
  feature_arrays: "data/retrain/flagship/feature_arrays_flagph.npz"

  checkpoint: "data/retrain/flagship/best_model_flag_ph.pt"
  predictions_dir: "data/retrain/flagship/predictions_flag_ph"
  eval_report: "results/flagship/rgcn_eval_flag_ph.md"
  hjflp_report: "results/flagship/rgcn_eval_hjflp_flag_ph.md"

windows:
  date_start: "1980-01-02"
  date_end: "2020-12-31"
  seq_length: 30
  forecast_horizon: 3
  stride: 3

split:
  method: holdout_blocks
  holdout_blocks:
    - ["2020-07-18", "2020-07-29"]
    - ["2020-09-10", "2020-09-21"]
    - ["2020-10-10", "2020-10-21"]
  guard_days: 3

masking:
  forecast_mask: obs+drivers

features:
  exclude_time:
    - "Discharge_CMS_lag_7"
    - "HoboWetDry0.05_lag_7"

model:
  version: "v2"
  hidden_dim: 64
  dropout: 0.1
  recur_dropout: 0.0
  return_states: false

training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stopping_patience: 20
  lambda_discharge: 1.0
  lambda_wetdry: 0.5
  false_positive_weight: 2.0
  seed: 42
